name: Publish v0.4.6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.4.6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='v0.4.6'
          ROOT='dist/OfflineFileTransfer'
          APP="$ROOT/app"
          mkdir -p "$APP/locales"

          (cd src && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui' -o "../$APP/LocalPhoneTransfer.exe" .)
          (cd src && GOOS=windows GOARCH=arm64 go build -trimpath -ldflags='-H=windowsgui' -o "../$APP/LocalPhoneTransfer_ARM64.exe" .)

          cp packaging/windows/Start.cmd "$ROOT/Start.cmd"
          cp scripts/windows/Bootstrap.ps1 "$APP/Bootstrap.ps1"
          cp scripts/windows/Configure-Firewall.ps1 "$APP/Configure-Firewall.ps1"
          cp scripts/windows/Start-Transfer.ps1 "$APP/Start-Transfer.ps1"
          cp scripts/windows/Update.ps1 "$APP/Update.ps1"
          cp scripts/windows/Launch.cmd "$APP/Launch.cmd"
          cp scripts/windows/Launch-Test.cmd "$APP/Launch-Test.cmd"
          cp config/default.json "$APP/transfer-config.json"
          cp locales/*.json "$APP/locales/"

          printf '%s\n' "$VERSION" > "$APP/VERSION.txt"
          (cd "$APP" && sha256sum LocalPhoneTransfer.exe LocalPhoneTransfer_ARM64.exe > SHA256SUMS.txt)

          ZIP="OfflineFileTransfer-${VERSION}.zip"
          (cd dist && zip -r "../$ZIP" OfflineFileTransfer >/dev/null)
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.4.6 "$ZIP" "$ZIP.sha256" \
            --target 815c3295407d7ad0adb9a398dbe8e20203285277 \
            --title 'Offline File Transfer v0.4.6' \
            --generate-notes

      - name: Remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v0.4.6.yml
          git commit -m 'Remove v0.4.6 publish workflow'
          git push
