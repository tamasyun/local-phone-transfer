name: Legacy ZIP package artifact

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/windows/**'
      - 'config/**'
      - 'locales/**'
      - 'packaging/windows/**'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version label'
        required: false
        default: 'dev'

permissions:
  contents: read

concurrency:
  group: legacy-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n '${{ inputs.version }}' ]]; then
            VERSION='${{ inputs.version }}'
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/OfflineFileTransfer"
          APP="$ROOT/app"
          mkdir -p "$APP/locales"

          (cd src && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../$APP/LocalPhoneTransfer.exe" .)
          (cd src && GOOS=windows GOARCH=arm64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../$APP/LocalPhoneTransfer_ARM64.exe" .)

          cp scripts/windows/Bootstrap.ps1 "$APP/Bootstrap.ps1"
          cp scripts/windows/Start-Transfer.ps1 "$APP/Start-Transfer.ps1"
          cp scripts/windows/Update.ps1 "$APP/Update.ps1"
          cp scripts/windows/Launch.cmd "$APP/Launch.cmd"
          cp scripts/windows/Launch-Test.cmd "$APP/Launch-Test.cmd"
          cp config/default.json "$APP/transfer-config.json"
          cp locales/*.json "$APP/locales/"
          cp packaging/windows/Setup.cmd "$ROOT/Setup.cmd"

          printf '%s\n' '${{ steps.version.outputs.value }}' > "$APP/VERSION.txt"
          (cd "$APP" && sha256sum LocalPhoneTransfer.exe LocalPhoneTransfer_ARM64.exe > SHA256SUMS.txt)

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'
          ZIP="OfflineFileTransfer-${VERSION}.zip"
          (cd dist && zip -r "../$ZIP" OfflineFileTransfer >/dev/null)
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload internal artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineFileTransfer-LegacyZIP-${{ steps.version.outputs.value }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
