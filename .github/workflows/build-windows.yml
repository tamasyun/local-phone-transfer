name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/windows/**'
      - 'config/**'
      - 'locales/**'
      - 'packaging/windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/windows/**'
      - 'config/**'
      - 'locales/**'
      - 'packaging/windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Build x64
        working-directory: src
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w -H=windowsgui' -o '../LocalPhoneTransfer.exe' .

      - name: Build ARM64
        working-directory: src
        env:
          GOOS: windows
          GOARCH: arm64
        run: go build -trimpath -ldflags='-s -w -H=windowsgui' -o '../LocalPhoneTransfer_ARM64.exe' .

      - name: Checksums
        run: sha256sum LocalPhoneTransfer.exe LocalPhoneTransfer_ARM64.exe > SHA256SUMS.txt

      - name: Upload CI binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-binaries
          if-no-files-found: error
          retention-days: 7
          path: |
            LocalPhoneTransfer.exe
            LocalPhoneTransfer_ARM64.exe
            SHA256SUMS.txt
