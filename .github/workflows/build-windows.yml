name: Build Windows binaries

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Build x64
        working-directory: src
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o '../スマホファイル転送.exe' .

      - name: Build ARM64
        working-directory: src
        env:
          GOOS: windows
          GOARCH: arm64
        run: go build -trimpath -ldflags='-s -w' -o '../スマホファイル転送_ARM64.exe' .

      - name: Update checksums
        run: sha256sum 'スマホファイル転送.exe' 'スマホファイル転送_ARM64.exe' > SHA256SUMS.txt

      - name: Commit binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'スマホファイル転送.exe' 'スマホファイル転送_ARM64.exe' SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No binary changes.'
            exit 0
          fi
          git commit -m 'Build updated Windows binaries [skip ci]'
          git push origin main
