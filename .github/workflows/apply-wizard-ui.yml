name: Apply wizard UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-wizard-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          main = Path('src/main.go')
          text = main.read_text()

          old = '''\tcase rest == "/locale" && r.Method == http.MethodPost:\n\t\ta.adminLocale(w, r)\n\tcase rest == "/upload" && r.Method == http.MethodPost:'''
          new = '''\tcase rest == "/locale" && r.Method == http.MethodPost:\n\t\ta.adminLocale(w, r)\n\tcase rest == "/continue" && r.Method == http.MethodPost:\n\t\ta.adminContinue(w)\n\tcase rest == "/upload" && r.Method == http.MethodPost:'''
          if old not in text:
              raise SystemExit('admin route marker not found')
          text = text.replace(old, new, 1)

          old = '''func (a *App) adminStatus(w http.ResponseWriter) {\n\trecv, _ := listFiles(a.receiveDir)\n\tsend, _ := listFiles(a.sendDir)\n\tidleRemaining, absoluteRemaining := a.timeoutState()\n\tw.Header().Set("Content-Type", "application/json; charset=utf-8")\n\t_ = json.NewEncoder(w).Encode(map[string]any{\n\t\t"receive":              recv,\n\t\t"send":                 send,\n\t\t"testMode":             a.testMode,\n\t\t"idleRemainingSec":     idleRemaining,\n\t\t"absoluteRemainingSec": absoluteRemaining,\n\t})\n}\n\nfunc (a *App) adminOpenFolder'''
          new = '''func (a *App) adminStatus(w http.ResponseWriter) {\n\trecv, _ := listFiles(a.receiveDir)\n\tsend, _ := listFiles(a.sendDir)\n\tidleRemaining, absoluteRemaining := a.timeoutState()\n\ta.mu.RLock()\n\tphoneConnected := a.phoneIP != ""\n\ta.mu.RUnlock()\n\tw.Header().Set("Content-Type", "application/json; charset=utf-8")\n\t_ = json.NewEncoder(w).Encode(map[string]any{\n\t\t"receive":              recv,\n\t\t"send":                 send,\n\t\t"testMode":             a.testMode,\n\t\t"phoneConnected":       phoneConnected,\n\t\t"idleRemainingSec":     idleRemaining,\n\t\t"absoluteRemainingSec": absoluteRemaining,\n\t})\n}\n\nfunc (a *App) adminContinue(w http.ResponseWriter) {\n\ta.touchActivity("admin_continue")\n\tw.WriteHeader(http.StatusNoContent)\n}\n\nfunc (a *App) adminOpenFolder'''
          if old not in text:
              raise SystemExit('admin status marker not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          template = Path('src/template_admin.go')
          text = template.read_text()

          style_marker = '</style></head><body><main class="wrap">'
          extra_css = r'''
.wizardNav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 28px}.wizardNavItem{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--sub);font-size:12px;font-weight:700;background:#fff}.wizardNavItem .dot{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px;border-radius:50%;background:var(--soft);color:#666}.wizardNavItem.active{border-color:#222;color:#222}.wizardNavItem.active .dot{background:#222;color:#fff}.wizardNavItem.done .dot{background:#eaf6ed;color:#247238}.wizardStep{display:none}.wizardStep.active{display:block}.wizardCard{max-width:780px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:28px;background:#fff}.wizardHead{display:flex;gap:14px;align-items:flex-start;margin-bottom:24px}.wizardNo{width:42px;height:42px;display:grid;place-items:center;flex:0 0 42px;border-radius:8px;background:#222;color:#fff;font-size:20px;font-weight:750}.wizardCard h2{font-size:25px;margin:3px 0 7px}.wizardCard p{margin:0;color:var(--sub);font-size:14px;line-height:1.7}.wizardBody{margin-top:20px}.wizardQrGrid{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}.wizardQrGrid .qr{width:220px;height:220px}.wizardActions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}.wizardActionsRight{display:flex;gap:9px;margin-left:auto}.waiting{display:flex;align-items:center;gap:9px;margin-top:20px;padding:12px 14px;border-radius:8px;background:var(--soft);color:#555;font-size:14px}.waitingDot{width:9px;height:9px;border-radius:50%;background:#777;animation:pulse 1.2s infinite}.waiting.connected{background:#eef8f0;color:#246b35}.waiting.connected .waitingDot{background:#2b7a3d;animation:none}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}.stopTop{white-space:nowrap}.doneIcon{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:#eaf6ed;color:#247238;font-size:30px;font-weight:800;margin-bottom:18px}.modalBackdrop{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);padding:20px;align-items:center;justify-content:center}.modalBackdrop.open{display:flex}.modal{width:min(460px,100%);background:#fff;border-radius:12px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.18)}.modal h2{font-size:21px;margin:0 0 10px}.modal p{color:var(--sub);font-size:14px;line-height:1.7;margin:0}.modalActions{display:flex;gap:9px;justify-content:flex-end;margin-top:22px}.modalActions .primary{border-radius:7px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}.modalActions button{min-height:40px}.step3Wrap{max-width:none}.step3Wrap .panels{margin-top:24px}.topActions .btn{padding:8px 11px;font-size:13px}@media(max-width:760px){.wizardNav{grid-template-columns:1fr 1fr}.wizardQrGrid{grid-template-columns:1fr}.wizardQrGrid .qr{width:210px;height:210px}.wizardActions{align-items:stretch;flex-direction:column}.wizardActionsRight{width:100%;margin-left:0}.wizardActionsRight .btn,.wizardActions>.btn{width:100%}}@media(max-width:520px){.wizardNav{grid-template-columns:1fr}.wizardCard{padding:20px}.wizardNavItem:not(.active){padding:7px 10px}.modalActions{flex-direction:column-reverse}.modalActions button{width:100%}}
'''
          if style_marker not in text:
              raise SystemExit('style marker not found')
          text = text.replace(style_marker, extra_css + style_marker, 1)

          body_start = text.index('<div class="top">')
          script_start = text.index('<script>\n', body_start)
          new_body = r'''<div class="top"><div><h1>{{t "app.title"}}</h1><p class="lead">{{tf "app.deviceLead" .DeviceName}}</p></div><div class="topActions">{{if .TestMode}}<div class="badge">{{t "app.testMode"}}</div>{{end}}<button id="globalStop" class="btn danger stopTop" onclick="stopApp()">{{t "finish.button"}}</button><label class="languageControl"><span>Language / 言語</span><select id="languageSelect" data-current="{{lang}}" aria-label="Language / 言語"><option value="ja" {{if eq (lang) "ja"}}selected{{end}}>日本語</option><option value="en" {{if eq (lang) "en"}}selected{{end}}>English</option></select></label></div></div>
{{if .TestMode}}<div class="testHint">{{t "app.testHint"}}</div>{{end}}
<div class="wizardNav" aria-label="Progress"><div class="wizardNavItem" data-nav-step="1"><span class="dot">1</span><span>{{t "wizard.step1.short"}}</span></div><div class="wizardNavItem" data-nav-step="2"><span class="dot">2</span><span>{{t "wizard.step2.short"}}</span></div><div class="wizardNavItem" data-nav-step="3"><span class="dot">3</span><span>{{t "wizard.step3.short"}}</span></div><div class="wizardNavItem" data-nav-step="4"><span class="dot">4</span><span>{{t "wizard.step4.short"}}</span></div></div>
<section class="wizardStep" data-step="1"><div class="wizardCard"><div class="wizardHead"><div class="wizardNo">1</div><div><h2>{{t "wizard.step1.title"}}</h2><p>{{if .TestMode}}{{t "step1.testDescription"}}{{else}}{{t "wizard.step1.description"}}{{end}}</p></div></div><div class="wizardBody">{{if .WiFiQR}}<div class="wizardQrGrid"><img class="qr" src="/qr.svg?text={{urlquery .WiFiQR}}" alt="QR"><div><div class="label">{{t "wifi.name"}}</div><div class="value">{{.WiFiSSID}}</div><div style="height:16px"></div><div class="label">{{t "wifi.password"}}</div><div class="value mono">{{.WiFiPassword}}</div><div class="muted" style="margin-top:12px">{{t "wifi.noInternet"}}</div></div></div>{{else}}<div class="notice">{{t "wifi.notUsed"}}</div>{{end}}</div><div class="wizardActions"><span></span><div class="wizardActionsRight"><button class="btn primary" onclick="goToStep(2)">{{t "wizard.step1.next"}} →</button></div></div></div></section>
<section class="wizardStep" data-step="2"><div class="wizardCard"><div class="wizardHead"><div class="wizardNo">2</div><div><h2>{{t "wizard.step2.title"}}</h2><p>{{if .TestMode}}{{t "step2.testDescription"}}{{else}}{{t "wizard.step2.description"}}{{end}}</p></div></div><div class="wizardBody">{{range $i,$u := .URLs}}{{if eq $i 0}}<div class="wizardQrGrid"><img class="qr" src="/qr.svg?text={{urlquery $u.URL}}" alt="QR"><div><div class="label">{{t "transfer.page"}}</div><div class="url">{{$u.URL}}</div><details class="details"><summary>{{t "transfer.connectionInfo"}}</summary><div class="muted" style="margin-top:8px">{{$u.Interface}} / {{$u.IP}}</div></details></div></div>{{end}}{{else}}<div class="notice">{{t "transfer.networkMissing"}}</div>{{end}}<div id="phoneWaiting" class="waiting"><span class="waitingDot"></span><span id="phoneWaitingText">{{t "wizard.step2.waiting"}}</span></div></div><div class="wizardActions"><button class="btn" onclick="goToStep(1)">← {{t "wizard.back"}}</button><span></span></div></div></section>
<section class="wizardStep" data-step="3"><div class="wizardCard step3Wrap"><div class="wizardHead"><div class="wizardNo">3</div><div><h2>{{t "wizard.step3.title"}}</h2><p>{{t "step3.description"}}</p></div></div><div class="actions"><label class="fileLabel primary">{{t "admin.pickFiles"}}<input id="sharePick" type="file" multiple></label><button class="btn" onclick="openFolder('send')">{{t "admin.openSend"}}</button><button class="btn" onclick="openFolder('receive')">{{t "admin.openReceive"}}</button></div><div id="shareStatus" class="status"></div><div class="panels"><div class="panel"><h3>{{t "admin.sendHeading"}}</h3><div class="muted">{{t "admin.sendDescription"}}</div><div id="sendList"></div><button class="btn danger" onclick="clearSide('send')" style="margin-top:12px">{{t "admin.clearSend"}}</button></div><div class="panel"><h3>{{t "admin.receiveHeading"}}</h3><div class="muted">{{t "admin.receiveDescription"}}</div><div id="recvList"></div><button class="btn danger" onclick="clearSide('receive')" style="margin-top:12px">{{t "admin.clearReceive"}}</button></div></div><div class="wizardActions"><button class="btn" onclick="goToStep(1)">← {{t "wizard.step3.back"}}</button><div class="wizardActionsRight"><button class="btn primary" onclick="stopApp()">{{t "finish.button"}} →</button></div></div></div></section>
<section class="wizardStep" data-step="4"><div class="wizardCard"><div class="doneIcon">✓</div><h2>{{t "wizard.step4.title"}}</h2><p id="doneBody">{{t "wizard.step4.description"}}</p><div class="wizardActions"><span></span><div class="wizardActionsRight"><button class="btn" onclick="closeWindow()">{{t "finish.closeWindow"}}</button></div></div></div></section>
</main>
<div id="idleModal" class="modalBackdrop" role="dialog" aria-modal="true"><div class="modal"><h2>{{t "idle.title"}}</h2><p>{{t "idle.body"}}</p><div class="modalActions"><button class="btn danger" onclick="stopApp()">{{t "idle.endNow"}}</button><button class="primary" onclick="continueSession()">{{t "idle.continue"}}</button></div></div></div>
<div id="absoluteModal" class="modalBackdrop" role="dialog" aria-modal="true"><div class="modal"><h2>{{t "absolute.title"}}</h2><p>{{t "absolute.body"}}</p><div class="modalActions"><button class="btn danger" onclick="stopApp()">{{t "idle.endNow"}}</button><button class="btn" onclick="dismissAbsoluteWarning()">{{t "absolute.dismiss"}}</button></div></div></div>
'''
          text = text[:body_start] + new_body + text[script_start:]

          js_start = text.index("const admin=", text.index('<script>\n'))
          js_end = text.index('\n</script></body></html>', js_start)
          new_js = r'''const admin='/admin/{{.AdminToken}}';const sessionKey='{{.AdminToken}}';let allowClose=false;let sessionEnded=false;let phoneTransitionPending=false;let idleModalVisible=false;let absoluteWarningDismissed=false;
if(sessionStorage.getItem('oftWizardSession')!==sessionKey){sessionStorage.setItem('oftWizardSession',sessionKey);sessionStorage.setItem('oftWizardStep','1')}
let currentStep=Number(sessionStorage.getItem('oftWizardStep')||1);if(currentStep<1||currentStep>3)currentStep=1;
window.addEventListener('beforeunload',e=>{if(!allowClose){e.preventDefault();e.returnValue=''}});
document.getElementById('languageSelect').addEventListener('change',async e=>{const previous=e.target.dataset.current;const body=new URLSearchParams({locale:e.target.value});try{const r=await fetch(admin+'/locale',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw 0;allowClose=true;location.reload()}catch(_){e.target.value=previous;alert('Language setting could not be saved. / 言語設定を保存できませんでした。')}});
const msg={preparing:{{t "admin.preparing"}},shareReady:{{t "admin.shareReady"}},confirmClearSend:{{t "admin.confirmClearSend"}},confirmClearReceive:{{t "admin.confirmClearReceive"}},emptySend:{{t "admin.emptySend"}},emptyReceive:{{t "admin.emptyReceive"}},finishConfirm:{{t "finish.confirm"}},finishDoneBody:{{t "wizard.step4.description"}},timeoutBody:{{t "finish.timeoutBody"}},phoneConnected:{{t "wizard.step2.connected"}},endedButton:{{t "finish.endedButton"}}};
function goToStep(step){if(sessionEnded)step=4;currentStep=step;if(step<4)sessionStorage.setItem('oftWizardStep',String(step));document.querySelectorAll('.wizardStep').forEach(el=>el.classList.toggle('active',Number(el.dataset.step)===step));document.querySelectorAll('.wizardNavItem').forEach(el=>{const n=Number(el.dataset.navStep);el.classList.toggle('active',n===step);el.classList.toggle('done',n<step)});const stop=document.getElementById('globalStop');if(step===4){stop.disabled=true;stop.textContent=msg.endedButton}else{stop.disabled=false}window.scrollTo({top:0,behavior:'smooth'})}
function fmt(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
document.getElementById('sharePick').addEventListener('change',async e=>{const st=document.getElementById('shareStatus');for(const f of e.target.files){st.textContent=msg.preparing+f.name;await rawUpload(f)}st.textContent=msg.shareReady;st.className='status ok';e.target.value='';loadStatus()});
function rawUpload(f){return new Promise(res=>{const x=new XMLHttpRequest();x.open('POST',admin+'/upload?name='+encodeURIComponent(f.name));x.onload=()=>res();x.onerror=()=>res();x.send(f)})}
async function openFolder(which){await fetch(admin+'/open?which='+which,{method:'POST'})}
async function clearSide(which){if(!confirm(which==='send'?msg.confirmClearSend:msg.confirmClearReceive))return;await fetch(admin+'/clear-'+which,{method:'POST'});loadStatus()}
function render(id,fs,empty){const el=document.getElementById(id);if(!fs.length){el.innerHTML='<div class="muted" style="padding:10px 0"></div>';el.firstChild.textContent=empty;return}el.innerHTML='';for(const f of fs){const d=document.createElement('div');d.className='file';const n=document.createElement('span');n.textContent=f.name;const z=document.createElement('span');z.className='muted';z.textContent=fmt(f.size);d.append(n,z);el.appendChild(d)}}
function showIdleWarning(){if(sessionEnded||idleModalVisible)return;idleModalVisible=true;document.getElementById('idleModal').classList.add('open')}
async function continueSession(){try{const r=await fetch(admin+'/continue',{method:'POST'});if(!r.ok)throw 0;document.getElementById('idleModal').classList.remove('open');idleModalVisible=false;await loadStatus()}catch(_){}}
function showAbsoluteWarning(){if(sessionEnded||absoluteWarningDismissed)return;document.getElementById('absoluteModal').classList.add('open')}
function dismissAbsoluteWarning(){absoluteWarningDismissed=true;document.getElementById('absoluteModal').classList.remove('open')}
function finishLocally(body){sessionEnded=true;allowClose=true;document.getElementById('idleModal').classList.remove('open');document.getElementById('absoluteModal').classList.remove('open');document.getElementById('doneBody').textContent=body;sessionStorage.setItem('oftWizardStep','4');goToStep(4)}
async function stopApp(){if(sessionEnded)return;if(!confirm(msg.finishConfirm))return;try{await fetch(admin+'/stop',{method:'POST'})}catch(_){}finishLocally(msg.finishDoneBody)}
function closeWindow(){allowClose=true;window.close()}
async function loadStatus(){if(sessionEnded)return;try{const r=await fetch(admin+'/api/status',{cache:'no-store'});if(!r.ok)throw 0;const s=await r.json();render('sendList',s.send,msg.emptySend);render('recvList',s.receive,msg.emptyReceive);if(currentStep===2&&s.phoneConnected&&!phoneTransitionPending){phoneTransitionPending=true;const wait=document.getElementById('phoneWaiting');wait.classList.add('connected');document.getElementById('phoneWaitingText').textContent=msg.phoneConnected;setTimeout(()=>{if(!sessionEnded)goToStep(3)},700)}const idle=Number(s.idleRemainingSec||0),absolute=Number(s.absoluteRemainingSec||0);if(idle<=0||absolute<=0){finishLocally(msg.timeoutBody);return}if(absolute<=300){showAbsoluteWarning()}else if(idle<=300){showIdleWarning()}}catch(_){} }
goToStep(currentStep);loadStatus();setInterval(loadStatus,2000);'''
          text = text[:js_start] + new_js + text[js_end:]
          template.write_text(text)

          additions = {
              'ja': {
                  'wizard.step1.short': 'Wi-Fi接続',
                  'wizard.step2.short': 'スマホで開く',
                  'wizard.step3.short': 'ファイル転送',
                  'wizard.step4.short': '完了',
                  'wizard.back': '戻る',
                  'wizard.step1.title': '専用Wi-Fiに接続する',
                  'wizard.step1.description': 'スマートフォンをこのPCが作成した専用Wi-Fiに接続してください。',
                  'wizard.step1.next': '接続したので次へ',
                  'wizard.step2.title': 'スマホで転送ページを開く',
                  'wizard.step2.waiting': 'スマートフォンからの接続を待っています…',
                  'wizard.step2.connected': 'スマートフォンが接続されました',
                  'wizard.step3.title': 'ファイルを転送する',
                  'wizard.step3.back': '接続案内を見る',
                  'wizard.step4.title': 'ファイル転送を終了しました',
                  'wizard.step4.description': '専用Wi-Fiも停止しました。スマートフォンは普段使っているWi-Fiやモバイル通信に戻してください。',
                  'idle.title': 'まもなく自動終了します',
                  'idle.body': 'しばらく操作がなかったため、この転送セッションはまもなく終了します。引き続き利用する場合は「利用を続ける」を押してください。',
                  'idle.continue': '利用を続ける',
                  'idle.endNow': '今すぐ終了',
                  'absolute.title': 'まもなく利用可能時間の上限です',
                  'absolute.body': 'このセッションは安全上の利用時間上限に近づいています。この上限は延長できません。必要な転送を完了してください。',
                  'absolute.dismiss': '確認しました',
                  'finish.endedButton': '終了済み',
                  'finish.closeWindow': 'この画面を閉じる'
              },
              'en': {
                  'wizard.step1.short': 'Wi-Fi',
                  'wizard.step2.short': 'Open on phone',
                  'wizard.step3.short': 'Transfer files',
                  'wizard.step4.short': 'Done',
                  'wizard.back': 'Back',
                  'wizard.step1.title': 'Connect to the dedicated Wi-Fi',
                  'wizard.step1.description': 'Connect your smartphone to the dedicated Wi-Fi created by this PC.',
                  'wizard.step1.next': 'Connected — Next',
                  'wizard.step2.title': 'Open the transfer page on your phone',
                  'wizard.step2.waiting': 'Waiting for your smartphone to connect…',
                  'wizard.step2.connected': 'Smartphone connected',
                  'wizard.step3.title': 'Transfer files',
                  'wizard.step3.back': 'View connection instructions',
                  'wizard.step4.title': 'File transfer ended',
                  'wizard.step4.description': 'The dedicated Wi-Fi has also stopped. Reconnect your phone to its usual Wi-Fi or mobile data.',
                  'idle.title': 'This session will end soon',
                  'idle.body': 'There has been no activity for a while, so this transfer session will end soon. Select “Continue using” to keep the session active.',
                  'idle.continue': 'Continue using',
                  'idle.endNow': 'End now',
                  'absolute.title': 'Maximum session time is approaching',
                  'absolute.body': 'This session is approaching its safety time limit. This limit cannot be extended. Complete any remaining transfers now.',
                  'absolute.dismiss': 'Got it',
                  'finish.endedButton': 'Ended',
                  'finish.closeWindow': 'Close this window'
              }
          }
          for lang in ('ja','en'):
              p = Path(f'locales/{lang}.json')
              data = json.loads(p.read_text())
              data.update(additions[lang])
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          gofmt -w src/main.go src/template_admin.go

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Commit implementation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-wizard-ui.yml
          git add src/main.go src/template_admin.go locales/ja.json locales/en.json
          git commit -m 'Add guided transfer wizard and session extension prompt'
          git push
